# Local Postgres for development.
#   podman compose up -d     (or: docker compose up -d)
services:
  postgres:
    image: postgres:17-alpine
    container_name: finance-sheet-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: finance
      POSTGRES_PASSWORD: finance
      POSTGRES_DB: finance_sheet
    ports:
      # 5432 is often already taken by another project; keep this app on its own port.
      - "5442:5432"
    volumes:
      - finance-sheet-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finance -d finance_sheet"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  finance-sheet-pgdata:
